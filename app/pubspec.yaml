name: period_app
description: "Period — local-first cycle tracker. Flutter client."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Lean HTTP client for talking to the Period FastAPI backend. Web, iOS, and
  # Android targets are all supported by the same package — no platform glue.
  http: ^1.2.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Bundled fonts — variable TTFs per family, all weights resolve from the
  # same file via the wght axis. Sourced from each font's canonical repo:
  #   Inter:           https://github.com/rsms/inter (OFL-1.1)
  #   Space Grotesk:   https://github.com/floriankarsten/space-grotesk (OFL-1.1)
  #   JetBrains Mono:  https://github.com/JetBrains/JetBrainsMono (OFL-1.1)
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
          weight: 400
        - asset: assets/fonts/InterVariable.ttf
          weight: 500
        - asset: assets/fonts/InterVariable.ttf
          weight: 600
        - asset: assets/fonts/InterVariable.ttf
          weight: 700
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
          weight: 600
